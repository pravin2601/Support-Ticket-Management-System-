services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: support_ticket
      POSTGRES_USER: support_ticket
      POSTGRES_PASSWORD: support_ticket_local_only
    ports:
      - "5432:5432"
    volumes:
      - support-ticket-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_ticket -d support_ticket"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  support-ticket-postgres:
